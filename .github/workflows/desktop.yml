name: Windows app

# Builds the Windows installer on every push that touches it, and publishes a GitHub Release when
# run manually with a version (Actions → Windows app → Run workflow) or when a v* tag is pushed.
# Only the built-in GITHUB_TOKEN is used - no secrets to configure.

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'apps/desktop/**'
      - 'apps/server/**'
      - 'apps/editor/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.3.0 (leave empty to only build)'
        required: false
      notes:
        description: 'Release notes (Markdown). Empty = list of commits since the last release'
        required: false

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: Build, test and package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"; release=true
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="${INPUT_VERSION#v}"; release=true
          else
            version="$(node -p "require('./apps/desktop/package.json').version")-ci.${GITHUB_RUN_NUMBER}"; release=false
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$version')"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          cd apps/desktop && npm pkg set version="$version"
          echo "Building FlowForge $version (release: $release)"

      - name: Build the app and its runtime (Node.js, server, editor, PostgreSQL)
        run: |
          pnpm --filter @flowforge/desktop build
          pnpm --filter @flowforge/desktop resources

      - name: Smoke test the runtime (database, migrations, server, workflow run, restart)
        run: node apps/desktop/dist/smoke.cjs

      - name: Build the installer
        working-directory: apps/desktop
        run: pnpm exec electron-builder --config electron-builder.config.cjs --win nsis --publish never

      - name: Install, launch and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Process -Wait -FilePath apps/desktop/release/FlowForge-Setup.exe -ArgumentList '/S'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\FlowForge'
          if (-not (Test-Path "$dir\FlowForge.exe")) { throw "FlowForge.exe was not installed to $dir" }
          $app = Start-Process -FilePath "$dir\FlowForge.exe" -PassThru
          $ready = $false
          for ($i = 0; $i -lt 90 -and -not $ready; $i++) {
            Start-Sleep -Seconds 2
            try { $ready = (Invoke-WebRequest -UseBasicParsing http://localhost:5678/readyz).StatusCode -eq 200 } catch {}
          }
          Get-Content "$env:APPDATA\FlowForge\logs\desktop.log" -ErrorAction SilentlyContinue
          if (-not $ready) { throw 'The installed app did not start its server' }
          (Invoke-WebRequest -UseBasicParsing http://localhost:5678/api/auth/status).Content
          if (-not (Invoke-WebRequest -UseBasicParsing http://localhost:5678/workflows).Content.Contains('id="root"')) { throw 'Editor not served' }
          # The uninstaller must stop the app, its server and PostgreSQL, then remove the files.
          Start-Process -Wait -FilePath "$dir\Uninstall FlowForge.exe" -ArgumentList '/S'
          Start-Sleep -Seconds 5
          $left = Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($dir, [StringComparison]::OrdinalIgnoreCase) }
          if ($left) { $left | Format-Table Id, Path; throw 'Processes still running after uninstall' }
          if (Test-Path "$dir\FlowForge.exe") { throw 'Uninstall left the app behind' }
          Write-Host 'Install, launch and uninstall: ok'

      - name: Release notes and manifest
        shell: bash
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          notes_file="$RUNNER_TEMP/notes.md"
          if [[ -n "$INPUT_NOTES" ]]; then
            printf '%s\n' "$INPUT_NOTES" > "$notes_file"
          else
            previous="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
            range="${previous:+$previous..}HEAD"
            { echo "### Changes"; git log --no-merges --pretty='- %s' $range | head -40; } > "$notes_file"
          fi
          node apps/desktop/scripts/release-manifest.mjs --version "${{ steps.version.outputs.version }}" --notes-file "$notes_file"
          cp "$notes_file" apps/desktop/release/notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: FlowForge-Windows-${{ steps.version.outputs.version }}
          retention-days: 14
          path: |
            apps/desktop/release/FlowForge-Setup.exe
            apps/desktop/release/FlowForge-Setup.exe.blockmap
            apps/desktop/release/latest.yml
            apps/desktop/release/release.json
            apps/desktop/release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.version.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/desktop/release
        run: |
          tag="v${{ steps.version.outputs.version }}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "FlowForge ${{ steps.version.outputs.version }}" --notes-file notes.md --latest \
            FlowForge-Setup.exe FlowForge-Setup.exe.blockmap latest.yml release.json SHA256SUMS.txt
