name: Windows app

# Builds the Windows installer on every push that touches it. Releases (with the phone apps) are
# published by release.yml, which calls this workflow.

on:
  push:
    branches: ['**']
    paths:
      - 'flowforge/apps/desktop/**'
      - 'flowforge/apps/server/**'
      - 'flowforge/apps/editor/**'
      - 'flowforge/packages/**'
      - 'flowforge/pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

permissions:
  contents: read

# The project lives in flowforge/.
defaults:
  run:
    working-directory: flowforge

jobs:
  windows:
    name: Build, test and package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: flowforge/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: flowforge/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            version="${INPUT_VERSION#v}"; release=true
          else
            version="$(node -p "require('./apps/desktop/package.json').version")-ci.${GITHUB_RUN_NUMBER}"; release=false
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$version')"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          cd apps/desktop && npm pkg set version="$version"
          echo "Building FlowForge $version (release: $release)"

      - name: Build the app and its runtime (Node.js, server, editor, PostgreSQL)
        # Private builds: repository secrets named below are built into the app (see README).
        # Unset secrets are skipped, so the app also builds without any.
        env:
          BUNDLE_META_APP_ID: ${{ secrets.META_APP_ID }}
          BUNDLE_META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          BUNDLE_META_EMBEDDED_SIGNUP_CONFIG_ID: ${{ secrets.META_EMBEDDED_SIGNUP_CONFIG_ID }}
          BUNDLE_WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
          BUNDLE_PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          BUNDLE_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BUNDLE_DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          BUNDLE_ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          BUNDLE_SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          BUNDLE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUNDLE_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUNDLE_UPDATE_GITHUB_TOKEN: ${{ secrets.UPDATE_GITHUB_TOKEN }}
        run: |
          pnpm --filter @flowforge/desktop build
          pnpm --filter @flowforge/desktop resources

      - name: Smoke test the runtime (database, migrations, server, workflow run, restart)
        run: node apps/desktop/dist/smoke.cjs

      - name: Build the installer
        working-directory: flowforge/apps/desktop
        env:
          RELEASES_PRIVATE: ${{ github.event.repository.private }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs --win nsis --publish never

      - name: Install, launch and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Process -Wait -FilePath apps/desktop/release/FlowForge-Setup.exe -ArgumentList '/S'
          # Find the install folder the way Windows does: from the app's uninstall entry.
          $entry = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall |
            Get-ItemProperty | Where-Object { $_.DisplayName -like 'FlowForge*' } | Select-Object -First 1
          if (-not $entry) { throw 'No FlowForge entry in Apps & features after installing' }
          $entry | Select-Object DisplayName, DisplayVersion, InstallLocation, UninstallString | Format-List
          $dir = if ($entry.InstallLocation) { $entry.InstallLocation.TrimEnd('\') } else { Split-Path ($entry.UninstallString -replace '^"([^"]+)".*$', '$1') }
          if (-not (Test-Path "$dir\FlowForge.exe")) { throw "FlowForge.exe was not installed to $dir" }
          $app = Start-Process -FilePath "$dir\FlowForge.exe" -PassThru
          $ready = $false
          for ($i = 0; $i -lt 90 -and -not $ready; $i++) {
            Start-Sleep -Seconds 2
            try { $ready = (Invoke-WebRequest -UseBasicParsing http://localhost:5678/readyz).StatusCode -eq 200 } catch {}
          }
          Get-Content "$env:APPDATA\FlowForge\logs\desktop.log" -ErrorAction SilentlyContinue
          if (-not $ready) { throw 'The installed app did not start its server' }
          (Invoke-WebRequest -UseBasicParsing http://localhost:5678/api/auth/status).Content
          if (-not (Invoke-WebRequest -UseBasicParsing http://localhost:5678/workflows).Content.Contains('id="root"')) { throw 'Editor not served' }
          # The uninstaller must stop the app, its server and PostgreSQL, then remove the files.
          Start-Process -Wait -FilePath "$dir\Uninstall FlowForge.exe" -ArgumentList '/S'
          Start-Sleep -Seconds 5
          $left = Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($dir, [StringComparison]::OrdinalIgnoreCase) }
          if ($left) { $left | Format-Table Id, Path; throw 'Processes still running after uninstall' }
          if (Test-Path "$dir\FlowForge.exe") { throw 'Uninstall left the app behind' }
          Write-Host 'Install, launch and uninstall: ok'

      - name: Manifest (for this build's artifact)
        shell: bash
        run: node apps/desktop/scripts/release-manifest.mjs --version "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: FlowForge-Windows-${{ steps.version.outputs.version }}
          retention-days: 14
          path: |
            flowforge/apps/desktop/release/FlowForge-Setup.exe
            flowforge/apps/desktop/release/FlowForge-Setup.exe.blockmap
            flowforge/apps/desktop/release/latest.yml
            flowforge/apps/desktop/release/release.json
            flowforge/apps/desktop/release/SHA256SUMS.txt
