name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The Linux jobs only typecheck/test the desktop app; the Windows build lives in desktop.yml.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The project lives in flowforge/.
defaults:
  run:
    working-directory: flowforge

jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      REDIS_URL: redis://localhost:6379
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowforge_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: flowforge/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: flowforge/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowforge
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowforge
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      ENCRYPTION_KEY: ci-only-encryption-key-ci-only-encryption-key
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: flowforge/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: flowforge/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @flowforge/editor build && pnpm --filter @flowforge/server build
      - run: pnpm --filter @flowforge/server db:deploy
      - name: Start server (with fake AI providers and a local STUN responder)
        env:
          MEDIA_ICE_SERVERS: stun:127.0.0.1:3478
          OPENAI_BASE_URL: http://127.0.0.1:5700/v1
          ANTHROPIC_BASE_URL: http://127.0.0.1:5700
          DEEPGRAM_BASE_URL: http://127.0.0.1:5700
          ELEVENLABS_BASE_URL: http://127.0.0.1:5700
          SARVAM_BASE_URL: http://127.0.0.1:5700
          AUTH_RATE_LIMIT: '1000'
        run: |
          (cd apps/server && npx tsx test/stun-server.ts > ../../stun.log 2>&1 &)
          (cd apps/server && npx tsx test/fake-ai-server.ts > ../../fake-ai.log 2>&1 &)
          sleep 3
          node apps/server/dist/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5678/readyz && break; sleep 1; done
      - run: pnpm --filter @flowforge/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @flowforge/e2e test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            flowforge/e2e/playwright-report
            flowforge/e2e/test-results
            flowforge/server.log
